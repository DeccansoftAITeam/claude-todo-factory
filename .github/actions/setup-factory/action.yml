name: Setup factory runner
description: Node, project deps, Claude Code CLI, and (optionally) Playwright Chromium.
inputs:
  browsers:
    description: Install Playwright Chromium (for the e2e test suite)
    default: "false"
  verifier:
    description: Prepare the verification engine (Playwright MCP + ffmpeg for video; uses the runner's Chrome)
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: npm ci --no-audit --no-fund
    - shell: bash
      run: npm install -g @anthropic-ai/claude-code@2.1.322 && claude --version
    - if: inputs.browsers == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
    - if: inputs.verifier == 'true'
      shell: bash
      # Run outside the repo so npx resolves the MCP's own playwright, not the project's @playwright/test.
      run: cd "$RUNNER_TEMP" && npx -y -p @playwright/mcp@0.0.85 playwright install --with-deps ffmpeg
    - shell: bash
      run: chmod +x factory/scripts/*.sh && mkdir -p .factory/context
